# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-byoaks

metadata:
  template: foundry-byoaks

# This AKS-only design target requires a compatible simplified-onboarding release.
# The historical demo minimum below does not guarantee that support; see README.md.
# The legacy seven-field configuration is in examples\azure.full.yaml.
requiredVersions:
  extensions:
    azure.ai.projects: 1.0.0-beta.9

infra:
  provider: microsoft.foundry

services:
  project:
    host: azure.ai.project
    agentHosting:
      clusterResourceId: ${AZURE_AKS_CLUSTER_ID}
